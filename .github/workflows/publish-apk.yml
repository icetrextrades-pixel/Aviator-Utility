name: Publish Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Name release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk AviatorUtility.apk

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" AviatorUtility.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" AviatorUtility.apk \
              --title "Aviator Utility ${GITHUB_REF_NAME}" \
              --notes "Installable Android WebView app for https://icetrexpredictor.streamlit.app/. An internet connection is required."
          fi
