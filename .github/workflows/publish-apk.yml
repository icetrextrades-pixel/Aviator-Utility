name: Publish Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "app/build.gradle"
      - "app/src/**"
      - ".github/workflows/publish-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Name release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk AviatorUtility.apk

      - name: Publish versioned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
            RELEASE_TAG="v${VERSION_NAME}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" AviatorUtility.apk --clobber
          else
            gh release create "${RELEASE_TAG}" AviatorUtility.apk \
              --title "Aviator Utility ${RELEASE_TAG}" \
              --notes "Android WebView app for https://icetrexpredictor.streamlit.app/. Internet connection required."
          fi
