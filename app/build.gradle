plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.icetrex.aviatorutility"
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.icetrex.aviatorutility"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
}
